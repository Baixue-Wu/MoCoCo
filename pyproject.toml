[project]
name = "mococo"
version = "0.1.0"
description = "MoCoCo: Movie Commentary Co-creation. Human-AI co-creation of movie commentary videos."
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.1",
    "edge-tts>=6.1",
    "scenedetect>=0.6.4",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "imageio-ffmpeg>=0.5",
    "pillow>=10",
    "httpx>=0.27",
    "rich>=13",
]

[project.scripts]
mococo = "mococo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mococo"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.ruff]
line-length = 100
